# ============================================================================
# hermes-agent CentOS 7 離線安裝包 — 共用設定
# ============================================================================
# 這個檔案會被 build/、release/、client/ 底下所有腳本 source。
# 只有 HERMES_SHARE_ROOT 是「硬約束」：Python 是用 --prefix=<這個路徑>/releases/<版本>/python
# 編譯的，編出來之後只能原封不動解壓到「一模一樣」的絕對路徑，否則 Python 會找不到自己的
# 標準函式庫（找路徑是編譯時寫死的，不是執行時才決定）。
#
# 如果共用目錄路徑之後要換，必須整包重新編譯，不能只是複製到新路徑。
#
# 請依貴單位 oVirt 環境實際的共用目錄掛載路徑修改下面這一行：
HERMES_SHARE_ROOT="/design/public/ai_test_area/Eddy_public_tool"

# hermes-agent 要安裝的版本（對應 PyPI 上的版本號）。
HERMES_AGENT_VERSION="0.19.0"

# 编译 Python 的版本，需落在 hermes-agent 的 requires-python (>=3.11,<3.14) 範圍內。
PYTHON_VERSION="3.11.11"

# 自己編的 OpenSSL 版本（CentOS 7 系統內建的 1.0.2k 太舊，Python 3.10+ 的 _ssl
# 模組編不起來）。3.0.x 是目前的 LTS 分支，見 build-python-centos7.sh 的說明。
OPENSSL_VERSION="3.0.15"

# 自己編的 SQLite 版本（CentOS 7 系統內建的 sqlite-devel 是 3.7.17，2013 年的版本，
# 不支援 partial index / UPSERT (ON CONFLICT) / 遞迴 CTE (WITH RECURSIVE) 這些
# hermes-agent 的 session 資料庫大量用到的語法，實測會在 /sessions 等指令炸出
# "OperationalError: near "WHERE": syntax error" 這類錯誤）。版本號、年份要跟
# https://www.sqlite.org/download.html 上公告的一致，見 build-python-centos7.sh 的說明。
SQLITE_VERSION="3.53.4"
SQLITE_YEAR="2026"

# 目標平台的 wheel tag（CentOS 7 x86_64 對應 manylinux2014）。
TARGET_PLATFORM="manylinux2014_x86_64"
TARGET_PYTHON_TAG="cp311"
TARGET_ABI_TAG="cp311"

# 核心功能範圍（對應 pyproject.toml 裡 hermes-agent 自己定義的 [all] extra：
# cron/cli/pty/mcp/homeassistant/sms/acp/google/web/youtube，
# 「不含」語音、Slack、Matrix、多平台訊息整合等重量級可選功能）。
HERMES_AGENT_EXTRAS="all"

# 保留幾個舊版本在共用目錄上以便回退（publish-release.sh 會清掉更舊的）。
KEEP_RELEASES=3
